name: Actualiser les prix

# GitHub lance les tâches programmées avec des heures de retard, ou pas du
# tout : avec un lancement par heure, on n'obtenait qu'environ 3 relevés par
# jour, à des heures quelconques. Le robot tourne donc en continu et fait
# lui-même un relevé par heure (à hh:13, de 6h à 23h, heure de Paris ; rien
# la nuit). Un job GitHub dure 6 h au plus : avant cette limite, il en lance
# un autre qui prend le relais.
#
# - « Relevé horaire » : la boucle, entretenue par les relais. Après chaque
#   relevé, elle envoie une notification au téléphone (ntfy) seulement s'il y a
#   une alerte : nouvelle bonne affaire ou baisse de prix significative. Entre
#   deux relevés, elle surveille le canal ntfy des demandes de l'appli : le
#   bouton ↻ y publie un message et un relevé est fait aussitôt. Les lancements
#   programmés ne servent que de secours : ils redémarrent la boucle si elle
#   s'est arrêtée, et s'arrêtent tout de suite si elle tourne. Une modification
#   du relevé (push) fait un relevé immédiat, puis remplace la boucle en cours
#   pour qu'elle tourne avec la nouvelle version.
# - « Relevé ponctuel » : un seul relevé, lancé à la main depuis GitHub.
run-name: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'ponctuel') && 'Relevé ponctuel' || 'Relevé horaire' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "ponctuel : un relevé ; boucle : un relevé par heure de 6h à 23h, en continu ; relais : suite de la boucle"
        type: choice
        options: [ponctuel, boucle, relais]
        default: ponctuel
      precedent:
        description: "relais : numéro du job de la boucle qui passe la main"
        required: false
        default: ""
  schedule:
    - cron: "43 * * * *"   # secours : redémarre la boucle si elle s'est arrêtée
  push:
    branches: [gh-pages]
    paths:
      - scripts/collect.py
      - scripts/record.py
      - scripts/notify.py
      - scripts/sources/**
      - .github/workflows/actualiser.yml

permissions:
  contents: write
  actions: write   # relais : lancer le job suivant de la boucle

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'ponctuel') && 15 || 355 }}
    steps:
      - uses: actions/checkout@v4

      - name: Relever les prix
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          PRECEDENT: ${{ inputs.precedent }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          case "$EVENT:$MODE" in
            *:relais) MODE=relais ;;
            schedule:* | *:boucle) MODE=boucle ;;
            push:*) MODE=push ;;
            *) MODE=ponctuel ;;
          esac
          run_json="$RUNNER_TEMP/run.json"

          paris_hour() { TZ=Europe/Paris date +%-H; }
          next_slot() {   # prochain hh:13, en secondes depuis 1970
            local now=$(date +%s) next
            next=$(( (now / 3600 + 1) * 3600 + 13 * 60 ))
            [ $((next - now)) -gt 3600 ] && next=$((next - 3600))
            echo "$next"
          }

          # Relevé, publication sur gh-pages, puis notification s'il y a une alerte
          # (scripts/notify.py n'envoie rien sinon), que le relevé soit celui de
          # l'heure ou demandé depuis l'appli. En cas de conflit avec un autre relevé,
          # on repart de la version en ligne et on y réapplique celui-ci.
          releve() {
            local published=
            # Plafond de 10 minutes : un site qui répondrait au compte-gouttes ne bloque pas la boucle.
            timeout 600 python3 scripts/collect.py "$run_json" || return 1
            for attempt in 1 2 3; do
              git fetch -q origin gh-pages && git reset -q --hard origin/gh-pages || { sleep 5; continue; }
              python3 scripts/record.py "$run_json" > /dev/null || return 1
              git add data/cpu/latest.json data/cpu/history.json
              git diff --cached --quiet && { published=1; break; }
              git commit -q -m "Relevé automatique du $(TZ=Europe/Paris date '+%d/%m à %Hh%M')"
              git push -q origin HEAD:gh-pages && { published=1; break; }
              sleep $((attempt * 5))
            done
            [ -n "$published" ] || return 1
            python3 scripts/notify.py || echo "::warning::Notification non envoyée."
          }

          # Attend l'heure $1 (secondes depuis 1970) en relevant le canal ntfy des
          # demandes de l'appli toutes les 15 s ; une demande déclenche un relevé.
          # « since » : identifiant de la dernière demande traitée ; au départ, l'heure
          # d'il y a 3 minutes, pour reprendre les demandes faites pendant un relais.
          since=$(( $(date +%s) - 180 ))
          last_request() {   # identifiant de la dernière demande après « since », vide s'il n'y en a pas
            curl -sf --max-time 10 "$1/json?poll=1&since=$since" | grep -E '"event" *: *"message"' | tail -n 1 \
              | grep -oE '"id" *: *"[^"]+"' | head -n 1 | sed -E 's/.*"([^"]+)"$/\1/'
          }
          wait_until() {
            local until=$1 url left id
            url=$(python3 -c 'import json; c = json.load(open("config.json")).get("ntfy") or {}; print(c["server"].rstrip("/") + "/" + c["refresh_topic"] if c.get("refresh_topic") else "")')
            while left=$((until - $(date +%s))); [ "$left" -gt 0 ]; do
              id=$([ -n "$url" ] && last_request "$url")
              if [ -n "$id" ]; then
                since=$id
                echo "Relevé demandé depuis l'appli à $(TZ=Europe/Paris date +%Hh%M)."
                releve manuel || echo "::warning::Relevé demandé en échec."
                id=$(last_request "$url")   # demandes faites pendant ce relevé : déjà satisfaites
                [ -n "$id" ] && since=$id
                continue
              fi
              left=$((until - $(date +%s)))
              [ "$left" -gt 0 ] && sleep $((left < 15 ? left : 15))
            done
          }

          # Dernier relevé publié il y a moins de 40 minutes ?
          recent() {
            git fetch -q origin gh-pages && git reset -q --hard origin/gh-pages
            python3 -c '
          import json, sys
          from datetime import datetime, timezone
          at = datetime.fromisoformat(json.load(open("data/cpu/latest.json"))["checked_at"])
          sys.exit(0 if (datetime.now(timezone.utc) - at).total_seconds() < 40 * 60 else 1)'
          }

          if [ "$MODE" = ponctuel ]; then
            releve manuel
            exit $?
          fi

          if [ "$MODE" = push ]; then
            releve manuel || echo "::warning::Relevé en échec."
          fi

          # Une seule boucle à la fois : on regarde les boucles plus anciennes encore
          # actives (sauf, pour un relais, le job qui vient de lui passer la main).
          older=$(gh run list --workflow actualiser.yml --limit 30 --json databaseId,displayTitle,status \
            --jq ".[] | select(.displayTitle == \"Relevé horaire\" and .status != \"completed\" and .databaseId < $GITHUB_RUN_ID and (.databaseId | tostring) != \"${PRECEDENT:-0}\") | .databaseId")
          if [ -n "$older" ] && [ "$MODE" = push ]; then
            # Nouvelle version du relevé : elle remplace la boucle en cours.
            for id in $older; do gh run cancel "$id" || echo "::warning::Impossible d'arrêter la boucle $id."; done
          elif [ -n "$older" ]; then
            echo "Une autre boucle horaire tourne déjà."
            exit 0
          fi

          started=$(date +%s)
          first=1
          while :; do
            if [ "$(paris_hour)" -ge 6 ]; then
              # Au démarrage, pas de relevé si le dernier est récent ou si le prochain créneau est proche.
              if [ "$first" = 1 ] && { [ $(( $(next_slot) - $(date +%s) )) -le 900 ] || recent; }; then
                echo "Pas de relevé immédiat : le prochain est à $(TZ=Europe/Paris date -d "@$(next_slot)" +%Hh%M)."
              else
                releve horaire || echo "::warning::Relevé de $(TZ=Europe/Paris date +%Hh%M) en échec, nouvel essai à l'heure suivante."
              fi
            fi
            first=0

            next=$(next_slot)
            if [ "$next" -gt $((started + 290 * 60)) ]; then
              # Bientôt la limite de 6 h : un nouveau job prendra le prochain relevé.
              wait_until $((next - 120))
              gh workflow run actualiser.yml --ref gh-pages -f mode=relais -f precedent="$GITHUB_RUN_ID" \
                || echo "::warning::Relais impossible : la programmation redémarrera la boucle."
              exit 0
            fi
            wait_until "$next"
          done
